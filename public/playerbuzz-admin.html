
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B-BALL Player Buzz Admin</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f3f6fa;color:#233247;font-family:Arial,sans-serif}
header{background:#172b43;color:white;padding:24px 5%;display:flex;justify-content:space-between;align-items:center}
header h1{font-size:21px;margin:0}
header span{font-size:12px;color:#b8c7d8}
main{max-width:1050px;margin:28px auto;padding:0 18px}
.panel,.news-card{background:white;border:1px solid #e5ebf2;border-radius:14px;padding:20px;margin-bottom:18px}
.login-row{display:flex;gap:10px;flex-wrap:wrap}
input,textarea,select{width:100%;padding:11px;border:1px solid #dce3eb;border-radius:8px;font-size:14px;background:white;color:#26384c}
.login-row input{flex:1;min-width:200px}
textarea{min-height:100px;resize:vertical;line-height:1.6}
button{border:0;border-radius:8px;padding:11px 18px;cursor:pointer;font-size:14px;font-weight:bold}
.primary{background:#f58225;color:white}
.approve{background:#16865b;color:white}
.reject{background:#f0f2f5;color:#687789}
.batch{background:#147b55;color:white}
.secondary{background:#eaf0f6;color:#41556b}
button:disabled{opacity:.5;cursor:not-allowed}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.toolbar select{width:auto;min-width:150px}
.status{font-size:13px;color:#7d8b9c;margin-top:12px;line-height:1.7}
.news-card h3{font-size:17px;margin:0 0 10px;line-height:1.5;overflow-wrap:anywhere}
.meta{font-size:12px;color:#8492a3;margin-bottom:14px;line-height:1.8;overflow-wrap:anywhere}
.field{margin-top:13px}
.field label{display:block;font-size:13px;font-weight:bold;margin-bottom:7px;color:#53657a}
.actions{display:flex;gap:10px;margin-top:16px}
.empty{text-align:center;color:#91a0b0;padding:45px 10px}
.source{color:#f58225}
.batch-panel{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px;padding-top:16px;border-top:1px solid #edf0f4}
.batch-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:#53657a}
.check-row{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer}
.check-row input{width:18px;height:18px}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.card-check{width:20px;height:20px;flex-shrink:0}
.featured-tag{display:inline-block;background:#fff1df;color:#b96a13;padding:4px 9px;border-radius:6px;font-size:12px;margin-bottom:8px}
@media(max-width:600px){
header{padding:18px}
header h1{font-size:17px}
.actions button{flex:1}
.panel{padding:15px}
.batch-panel{align-items:stretch}
.batch-panel button{width:100%}
}
</style>
</head>
<body>
<header>
  <h1>🏀 B-BALL Player Buzz Admin</h1>
  <span>PLAYER BUZZ ADMIN</span>
</header>

<main>
  <section class="panel">
    <h2 style="font-size:17px;margin-top:0">Administrator Login</h2>
    <div class="login-row">
      <input id="password" type="password" placeholder="Enter administrator password">
      <button class="primary" id="loginBtn">Login & Load News</button>
    </div>
    <div class="status" id="message">Please enter your administrator password.</div>
  </section>

  <section class="panel" id="workspace" hidden>
    <div class="toolbar">
      <strong>News Review List</strong>
      <div style="display:flex;gap:8px;align-items:center">
        <select id="statusFilter">
          <option value="featured">⭐ AI Daily Picks</option>
          <option value="pending">Pending Review</option>
          <option value="approved">Approved</option>
          <option value="rejected">Rejected</option>
          <option value="all">All News</option>
        </select>
        <button class="primary" id="refreshBtn">Refresh</button>
      </div>
    </div>

    <div class="status" id="count"></div>

    <div class="batch-panel" id="batchPanel">
      <div class="batch-left">
        <label class="check-row">
          <input type="checkbox" id="selectAll">
          Select Current Page
        </label>
        <span id="selectedCount">0 selected</span>
        <span>Maximum 20 items per batch</span>
      </div>
      <button class="batch" id="batchApproveBtn">Approve Selected News</button>
    </div>
  </section>

  <div id="newsList"></div>
</main>

<script>
const API_URL = "/playerbuzz/review";
let adminPassword = "";
let currentItems = [];

const message = document.getElementById("message");
const workspace = document.getElementById("workspace");
const newsList = document.getElementById("newsList");
const batchPanel = document.getElementById("batchPanel");
const batchApproveBtn = document.getElementById("batchApproveBtn");
const statusFilter = document.getElementById("statusFilter");

function setMessage(text) {
  message.textContent = text;
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[char]));
}

function canBatchApprove() {
  return ["pending", "featured"].includes(statusFilter.value);
}

async function apiRequest(method, body = null, status = "featured") {
  const options = {
    method,
    headers: {
      "X-Admin-Password": adminPassword
    }
  };

  if (body) {
    options.headers["Content-Type"] = "application/json";
    options.body = JSON.stringify(body);
  }

  const url = method === "GET"
    ? API_URL + "?status=" + encodeURIComponent(status)
    : API_URL;

  const response = await fetch(url, options);
  const data = await response.json();

  if (!response.ok || !data.success) {
    throw new Error(data.message || "Request failed");
  }

  return data;
}

async function login() {
  adminPassword = document.getElementById("password").value.trim();

  if (!adminPassword) {
    setMessage("Please enter your administrator password.");
    return;
  }

  document.getElementById("loginBtn").disabled = true;
  setMessage("Verifying password...");

  try {
    await loadNews();
    workspace.hidden = false;
    document.getElementById("password").value = "";
    setMessage("Login successful. You will need to log in again after closing this page.");
  } catch (error) {
    adminPassword = "";
    setMessage("Login failed: " + error.message);
  } finally {
    document.getElementById("loginBtn").disabled = false;
  }
}

function updateSelection() {
  const checked = newsList.querySelectorAll(".item-check:checked");
  const count = checked.length;

  document.getElementById("selectedCount").textContent =
    count + " selected";

  document.getElementById("selectAll").checked =
    currentItems.length > 0 &&
    currentItems.every(item => {
      const checkbox = newsList.querySelector(
        '.item-check[data-id="' + CSS.escape(String(item.id)) + '"]'
      );
      return checkbox && checkbox.checked;
    });

  batchApproveBtn.disabled =
    !canBatchApprove() ||
    count === 0 ||
    count > 20;

  if (count > 20) {
    document.getElementById("selectedCount").textContent =
      count + " selected. Please select no more than 20.";
  }
}

function getCategoryOptions(selectedCategory) {
  const categories = [
    ["NBA新闻", "NBA News"],
    ["球员动态", "Player Updates"],
    ["场外生活", "Off-Court Lifestyle"],
    ["社交动态", "Social Media"],
    ["趣闻八卦", "Player Buzz"]
  ];

  return categories.map(([value, label]) =>
    `<option value="${value}" ${selectedCategory === value ? "selected" : ""}>${label}</option>`
  ).join("");
}

function renderNews(items) {
  currentItems = items || [];

  if (!items || items.length === 0) {
    newsList.innerHTML = '<div class="panel empty">No news found for this category.</div>';
    updateSelection();
    return;
  }

  newsList.innerHTML = items.map(item => {
    const englishTitle = item.original_title || item.chinese_title || "";
    const englishContent = item.original_content || item.chinese_content || "";

    return `
    <article class="news-card" data-id="${escapeHtml(item.id)}">
      <div class="card-top">
        <div>
          ${item.ai_selected == 1
            ? `<div class="featured-tag">⭐ AI Daily Pick · ${escapeHtml(item.selection_date || "")}</div>`
            : ""}
          <h3>${escapeHtml(englishTitle)}</h3>
          <div class="meta">
            Source: <span class="source">${escapeHtml(item.source || "Unknown")}</span>
            · Published: ${escapeHtml(item.published_at || "Unknown")}
            · Status: ${escapeHtml(item.review_status || "Unknown")}
          </div>
        </div>
        ${item.review_status === "pending"
          ? `<input class="card-check item-check" type="checkbox" data-id="${escapeHtml(item.id)}" aria-label="Select this news item">`
          : ""}
      </div>

      <div class="field">
        <label>English Title (Original)</label>
        <input class="chinese-title" value="${escapeHtml(englishTitle)}">
      </div>

      <div class="field">
        <label>English Summary (Brief summary in your own words; do not copy the full article)</label>
        <textarea class="chinese-content">${escapeHtml(englishContent)}</textarea>
      </div>

      <div class="field">
        <label>Player Name (Optional; keep the original English name)</label>
        <input class="player-name" value="${escapeHtml(item.player_name || "")}" placeholder="Example: LeBron James">
      </div>

      <div class="field">
        <label>News Category</label>
        <select class="category">
          ${getCategoryOptions(item.category)}
        </select>
      </div>

      <div class="meta" style="margin-top:12px">
        Original Source: ${escapeHtml(item.source_link || "Not provided")}
      </div>

      <div class="actions">
        <button class="approve" data-action="approve">Approve</button>
        <button class="reject" data-action="reject">Reject</button>
      </div>
    </article>
  `;
  }).join("");

  newsList.querySelectorAll("button[data-action]").forEach(button => {
    button.addEventListener("click", () => reviewItem(button));
  });

  newsList.querySelectorAll(".item-check").forEach(checkbox => {
    checkbox.addEventListener("change", updateSelection);
  });

  updateSelection();
}

async function loadNews() {
  const status = statusFilter.value;

  setMessage("Loading news...");
  newsList.innerHTML = '<div class="panel empty">Loading...</div>';

  batchApproveBtn.disabled = true;
  document.getElementById("selectAll").checked = false;

  try {
    const data = await apiRequest("GET", null, status);

    document.getElementById("count").textContent =
      "Showing " + data.total + " news items" +
      (status === "featured" ? " · Date: " + data.date : "");

    batchPanel.hidden = !canBatchApprove();
    renderNews(data.items);
    setMessage("News loaded successfully.");
  } catch (error) {
    newsList.innerHTML = "";
    setMessage("Failed to load news: " + error.message);
    throw error;
  }
}

async function reviewItem(button) {
  const card = button.closest(".news-card");
  const action = button.dataset.action;

  const body = {
    id: card.dataset.id,
    action
  };

  if (action === "approve") {
    body.chinese_title = card.querySelector(".chinese-title").value.trim();
    body.chinese_content = card.querySelector(".chinese-content").value.trim();
    body.player_name = card.querySelector(".player-name").value.trim();
    body.category = card.querySelector(".category").value;

    if (!body.chinese_title || !body.chinese_content) {
      alert("Please enter the English title and English summary before approving.");
      return;
    }
  }

  if (action === "reject" && !confirm("Are you sure you want to reject this news item?")) {
    return;
  }

  card.querySelectorAll("button").forEach(item => item.disabled = true);

  try {
    const result = await apiRequest("POST", body);
    alert(result.message);
    await loadNews();
  } catch (error) {
    alert("Operation failed: " + error.message);
    card.querySelectorAll("button").forEach(item => item.disabled = false);
  }
}

function selectCurrentPage() {
  const checkboxes = newsList.querySelectorAll(".item-check");
  const allChecked = checkboxes.length > 0 &&
    Array.from(checkboxes).every(item => item.checked);

  checkboxes.forEach((checkbox, index) => {
    checkbox.checked = !allChecked && index < 20;
  });

  updateSelection();
}

async function batchApprove() {
  if (!canBatchApprove()) {
    alert("Please switch to AI Daily Picks or Pending Review first.");
    return;
  }

  const selectedCards = Array.from(
    newsList.querySelectorAll(".item-check:checked")
  );

  if (selectedCards.length === 0) {
    alert("Please select the news items you want to approve.");
    return;
  }

  if (selectedCards.length > 20) {
    alert("You can approve a maximum of 20 items at a time.");
    return;
  }

  const items = [];

  for (const checkbox of selectedCards) {
    const card = checkbox.closest(".news-card");

    const item = {
      id: card.dataset.id,
      chinese_title: card.querySelector(".chinese-title").value.trim(),
      chinese_content: card.querySelector(".chinese-content").value.trim(),
      player_name: card.querySelector(".player-name").value.trim(),
      category: card.querySelector(".category").value
    };

    if (!item.chinese_title || !item.chinese_content) {
      alert("Some selected news items are missing an English title or summary.");
      return;
    }

    items.push(item);
  }

  const confirmed = confirm(
    "Approve the selected " + items.length +
    " news items?\n\nOnly the selected pending news items will be approved."
  );

  if (!confirmed) return;

  batchApproveBtn.disabled = true;
  setMessage("Approving selected news. Please do not close this page...");

  try {
    const result = await apiRequest("POST", {
      action: "approve_batch",
      items
    });

    alert(
      "Batch review completed!\n\nApproved: " + result.approved +
      "\nSkipped: " + result.skipped
    );

    await loadNews();
  } catch (error) {
    alert("Batch approval failed: " + error.message);
    batchApproveBtn.disabled = false;
    setMessage("Batch approval failed: " + error.message);
  }
}

document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("refreshBtn").addEventListener("click", loadNews);
statusFilter.addEventListener("change", loadNews);
document.getElementById("selectAll").addEventListener("change", selectCurrentPage);
batchApproveBtn.addEventListener("click", batchApprove);

document.getElementById("password").addEventListener("keydown", event => {
  if (event.key === "Enter") login();
});
</script>
</body>
</html>
