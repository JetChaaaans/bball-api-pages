
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>B-BALL AI 翻译测试</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 16px;
      background: #f3f6fa;
      color: #24364c;
      font-family: Arial, "Microsoft YaHei", sans-serif;
    }

    .container {
      max-width: 700px;
      margin: 30px auto;
      padding: 25px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0,0,0,.05);
    }

    h2 { margin-top: 0; }

    .desc {
      color: #8793a2;
      font-size: 14px;
      line-height: 1.6;
    }

    label {
      display: block;
      margin: 22px 0 8px;
      font-weight: bold;
    }

    input, textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #dce3eb;
      border-radius: 8px;
      font-size: 15px;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #ff861f;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled { opacity: .6; }

    .result {
      margin-top: 12px;
      padding: 16px;
      min-height: 70px;
      border-radius: 8px;
      background: #f5f7fa;
      line-height: 1.8;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .status {
      margin-top: 12px;
      color: #8290a1;
      font-size: 13px;
    }

    .raw {
      font-size: 12px;
      font-family: Consolas, monospace;
      max-height: 450px;
      overflow: auto;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>B-BALL AI 翻译测试</h2>

    <div class="desc">
      使用 Cloudflare Workers AI 测试 NBA 英文新闻翻译。
      管理员密码不会保存。
    </div>

    <label>管理员密码</label>
    <input id="password" type="password"
      placeholder="输入 Cloudflare 管理员密码"
      autocomplete="off">

    <label>英文测试内容</label>
    <textarea id="source">LeBron James scored 30 points and added 8 assists in the Lakers' victory last night.</textarea>

    <button id="translateBtn" onclick="translateText()">
      开始翻译
    </button>

    <div class="status" id="status">等待测试</div>

    <label>中文翻译结果</label>
    <div class="result" id="result">翻译结果将在这里显示。</div>

    <label>AI 原始返回数据（排查用）</label>
    <div class="result raw" id="rawResult">等待 AI 返回数据。</div>
  </div>

  <script>
    async function translateText() {
      const password = document.getElementById("password").value.trim();
      const source = document.getElementById("source").value.trim();
      const button = document.getElementById("translateBtn");
      const status = document.getElementById("status");
      const resultBox = document.getElementById("result");
      const rawBox = document.getElementById("rawResult");

      if (!password) {
        alert("请先输入管理员密码");
        return;
      }

      if (!source) {
        alert("请输入英文测试内容");
        return;
      }

      button.disabled = true;
      button.textContent = "AI 正在翻译...";
      status.textContent = "正在连接 Cloudflare AI...";
      resultBox.textContent = "";
      rawBox.textContent = "等待返回数据...";

      try {
        const response = await fetch("/playerbuzz/ai-test", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-Admin-Password": password
          },
          body: JSON.stringify({ text: source })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          resultBox.textContent = data.message || "翻译请求失败";

          rawBox.textContent = JSON.stringify(
            data.rawResult !== undefined
              ? data.rawResult
              : data,
            null,
            2
          );

          status.textContent = "请求失败，已显示返回数据";
          return;
        }

        resultBox.textContent = data.translatedText;
        rawBox.textContent = JSON.stringify(data, null, 2);
        status.textContent = "翻译成功 · 模型：" + data.model;

      } catch (error) {
        resultBox.textContent = "网页请求失败：" + error.message;
        rawBox.textContent = error.stack || error.message;
        status.textContent = "请求发生异常";
      } finally {
        button.disabled = false;
        button.textContent = "开始翻译";
      }
    }
  </script>
</body>
</html>
